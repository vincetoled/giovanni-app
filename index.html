<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1916">
<title>Giovanni — Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/service.css">
<link rel="stylesheet" href="css/station.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Banner offline -->
<div id="banner-offline" class="banner-offline">⚠ Connexion perdue — Vérifiez votre Wi-Fi</div>

<!-- Debug panel (visible uniquement Admin) -->
<div id="debug-wrap" style="display:none;">
  <div id="debug-panel"></div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- ============================================================
     VUE SERVICE
     ============================================================ -->
<div id="view-service" class="view active">
  <div class="view-header">
    <h1>Service</h1>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn-rupture" style="padding:6px 10px;font-size:11px" onclick="openRuptureModal('service')">⚠ Rupture</button>
      <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px" onclick="openSonModal()">🔔</button>
    </div>
  </div>
  <div class="view-content" id="service-content"></div>
</div>

<!-- ============================================================
     VUE CUISINE
     ============================================================ -->
<div id="view-cuisine" class="view">
  <div class="view-header">
    <h1>Cuisine</h1>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px" onclick="openSonModal()">🔔</button>
  </div>
  <div class="station-controls">
    <button class="btn-rupture" onclick="openRuptureModal('cuisine')">⚠ Rupture</button>
    <button class="btn-tout-pret-global" onclick="marquerToutPretStation('cuisine')">✓ Tout Prêt Cuisine</button>
  </div>
  <div class="station-commandes" id="cuisine-content"></div>
</div>

<!-- ============================================================
     VUE BAR
     ============================================================ -->
<div id="view-bar" class="view">
  <div class="view-header">
    <h1>Bar</h1>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px" onclick="openSonModal()">🔔</button>
  </div>
  <div class="station-controls">
    <button class="btn-rupture" onclick="openRuptureModal('bar')">⚠ Rupture</button>
    <button class="btn-tout-pret-global" onclick="marquerToutPretStation('bar')">✓ Tout Prêt Bar</button>
  </div>
  <div class="station-commandes" id="bar-content"></div>
</div>

<!-- ============================================================
     VUE ADMIN
     ============================================================ -->
<div id="view-admin" class="view">
  <div class="view-header">
    <h1>Admin</h1>
    <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px" onclick="deconnecterAdmin()">Verrouiller</button>
  </div>
  <div class="view-content" id="admin-content"></div>
</div>

<!-- ============================================================
     NAV BOTTOM
     ============================================================ -->
<nav class="nav-bottom">
  <button class="nav-btn active" id="nav-service" onclick="showView('service')">
    <span class="nav-icon">🍽</span>
    <span class="nav-label">Service</span>
    <span id="badge-service" class="nav-badge" style="display:none"></span>
  </button>
  <button class="nav-btn" id="nav-cuisine" onclick="showView('cuisine')">
    <span class="nav-icon">👨‍🍳</span>
    <span class="nav-label">Cuisine</span>
    <span id="badge-cuisine" class="nav-badge" style="display:none"></span>
  </button>
  <button class="nav-btn" id="nav-bar" onclick="showView('bar')">
    <span class="nav-icon">🍹</span>
    <span class="nav-label">Bar</span>
    <span id="badge-bar" class="nav-badge" style="display:none"></span>
  </button>
  <button class="nav-btn" id="nav-admin" onclick="showView('admin')">
    <span class="nav-icon">⚙️</span>
    <span class="nav-label">Admin</span>
  </button>
  <div class="connexion-dot" id="connexion-dot"></div>
</nav>

<!-- ============================================================
     MODAL OVERLAY (shared)
     ============================================================ -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="modal-title">Commande</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Confirm Popup Overlay (Cuisine tap+confirm) -->
<div id="confirm-popup-overlay" onclick="closeConfirmPopup(event)">
  <div class="confirm-popup" id="confirm-popup-box"></div>
</div>

<!-- Contenance bottom-sheet -->
<div class="contenance-overlay" id="contenance-overlay" onclick="closeContenanceSheet()">
  <div class="contenance-sheet" onclick="event.stopPropagation()">
    <div class="contenance-sheet-handle"></div>
    <div class="contenance-sheet-title" id="contenance-sheet-title"></div>
    <div class="contenance-sheet-sub" id="contenance-sheet-sub"></div>
    <div class="contenance-grid" id="contenance-grid"></div>
  </div>
</div>

<!-- Options picker bottom-sheet -->
<div class="options-picker-overlay" id="options-picker-overlay">
  <div class="options-picker-sheet" onclick="event.stopPropagation()">
    <div class="contenance-sheet-handle"></div>
    <div class="contenance-sheet-title" id="options-picker-title"></div>
    <div class="contenance-sheet-sub" id="options-picker-sub"></div>
    <div id="options-picker-body"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeOptionsPicker()">Annuler</button>
      <button class="btn btn-primary" style="flex:2" onclick="confirmOptionsAndAdd()">Ajouter →</button>
    </div>
  </div>
</div>

<!-- Modal PIN Admin -->
<div id="modal-pin" class="modal-overlay" style="align-items:center;padding:24px">
  <div style="background:var(--bg-modal);border-radius:var(--radius);padding:24px;width:100%;max-width:320px">
    <h2 style="font-size:20px;color:var(--or);text-align:center;margin-bottom:4px">Administration</h2>
    <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:16px">Entrez le code PIN</p>
    <div class="pin-display" id="pin-display">·  ·  ·  ·</div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn" onclick="pinClear()" style="font-size:14px;color:var(--text-muted)">⌫</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn" onclick="pinCancel()" style="font-size:12px;color:var(--text-muted)">✕</button>
    </div>
    <div id="pin-error" style="color:var(--terre);font-size:12px;text-align:center;min-height:18px"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/service.js"></script>
<script src="js/station.js"></script>
<script src="js/admin.js"></script>
<script src="js/init.js"></script>
</body>
</html>
