<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A1916">
<title>Giovanni — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --or: #C9A84C;
  --or-light: #E2C47A;
  --terre: #C0522A;
  --bg: #1A1916;
  --bg-card: #252320;
  --bg-input: #2E2C28;
  --text: #F0EBE0;
  --text-muted: #8B8680;
  --border: rgba(201,168,76,0.15);
  --border-active: rgba(201,168,76,0.5);
  --green: #4CAF7D;
  --radius: 12px;
  --radius-sm: 8px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100%;padding-bottom:calc(90px + var(--safe-bottom))}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--or)}

/* HEADER */
.menu-header{
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:20px 16px 16px;position:sticky;top:0;z-index:50;
}
.resto-name{font-size:28px;color:var(--or);letter-spacing:1px;line-height:1.1}
.resto-table{font-size:14px;color:var(--text-muted);margin-top:4px}

/* STATUT DEMANDES */
.mes-demandes{padding:12px 16px;border-bottom:1px solid var(--border)}
.demande-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;
  font-size:13px;
}
.demande-card.en-attente{border-color:var(--or)}
.demande-card.acceptee{border-color:var(--green)}
.demande-card.refusee{border-color:var(--terre)}
.demande-status{font-weight:600;margin-bottom:4px}

/* NAV CATÉGORIES */
.cats-nav{
  display:flex;gap:6px;overflow-x:auto;
  padding:12px 16px;scrollbar-width:none;
  position:sticky;top:72px;z-index:40;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.cats-nav::-webkit-scrollbar{display:none}
.cat-nav-btn{
  white-space:nowrap;padding:6px 16px;border-radius:20px;
  font-size:12px;font-weight:500;flex-shrink:0;
  background:rgba(255,255,255,.06);color:var(--text-muted);
  border:1px solid transparent;transition:all .15s;
}
.cat-nav-btn.active{background:rgba(201,168,76,.15);color:var(--or);border-color:var(--border-active)}

/* MENU CONTENT */
.menu-content{padding:0 0 16px}
.cat-section{padding:16px 16px 0}
.cat-title{
  font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--or);
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);letter-spacing:.5px;
}

/* ARTICLE CARD */
.article-card{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);
}
.article-card:last-child{border-bottom:none}
.article-info{flex:1;min-width:0}
.article-nom{font-size:14px;font-weight:500;line-height:1.3}
.article-desc{font-size:12px;color:var(--text-muted);margin-top:2px}
.article-prix{font-size:15px;color:var(--or);font-weight:600;white-space:nowrap}
.article-indispo{font-size:11px;color:var(--terre);margin-top:2px}

.add-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(201,168,76,.15);border:1px solid var(--border-active);
  color:var(--or);font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .1s;
}
.add-btn:active{background:rgba(201,168,76,.35)}
.add-btn:disabled{opacity:.3;pointer-events:none}

/* PANIER FLOTTANT */
.panier-float{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:10px 16px calc(10px + var(--safe-bottom));
  background:linear-gradient(transparent,var(--bg) 20%);
}
.panier-btn{
  background:var(--or);color:#1A1916;
  border-radius:var(--radius);padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:15px;font-weight:700;width:100%;
  box-shadow:0 4px 20px rgba(201,168,76,.4);
  transition:opacity .15s;
}
.panier-btn:active{opacity:.85}
.panier-count{
  background:rgba(0,0,0,.2);border-radius:20px;
  padding:2px 10px;font-size:14px;
}

/* MODAL PANIER */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:150;display:none;align-items:flex-end;
  backdrop-filter:blur(2px);
}
.modal-overlay.active{display:flex}
.modal-sheet{
  background:#1E1C19;width:100%;
  border-radius:12px 12px 0 0;
  max-height:88vh;display:flex;flex-direction:column;
  padding-bottom:var(--safe-bottom);
}
.modal-handle{width:40px;height:4px;background:rgba(201,168,76,.3);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.modal-header{
  padding:16px 16px 12px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-header h2{font-size:18px;color:var(--or)}
.modal-close{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.modal-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}

/* LIGNES PANIER */
.panier-ligne{
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;
}
.pl-top{display:flex;align-items:center;gap:8px}
.pl-nom{flex:1;font-size:13px;font-weight:500}
.pl-prix{font-size:13px;color:var(--or);font-weight:600}
.qte-ctrl{display:flex;align-items:center;gap:8px}
.qte-btn{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.qte-val{font-size:14px;font-weight:600;min-width:22px;text-align:center}

.total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0 8px;font-size:16px;font-weight:600;
}
.total-price{color:var(--or)}

.btn-envoyer{
  background:var(--or);color:#1A1916;
  border-radius:var(--radius-sm);padding:14px;
  font-size:15px;font-weight:700;width:100%;
  transition:opacity .15s;
}
.btn-envoyer:active{opacity:.85}
.btn-envoyer:disabled{opacity:.4;pointer-events:none}

/* CONFIRMATION */
.confirmation{
  text-align:center;padding:32px 16px;
}
.confirmation .icon{font-size:48px;margin-bottom:12px}
.confirmation h3{font-size:20px;color:var(--or);margin-bottom:8px}
.confirmation p{font-size:14px;color:var(--text-muted);line-height:1.5}

/* BADGE */
.badge{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.3px;
}

/* TOAST */
#toast-container{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;width:calc(100% - 32px);max-width:360px;
}
.toast{
  background:var(--bg-card);border:1px solid var(--border);
  padding:10px 16px;border-radius:var(--radius);
  font-size:13px;text-align:center;
  opacity:0;animation:toastIn .3s forwards;
}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--terre);color:var(--terre)}
@keyframes toastIn{to{opacity:1}}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:60px 24px;
  color:var(--text-muted);font-size:14px;
}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- HEADER -->
<div class="menu-header">
  <h1 class="resto-name">Ristorante Giovanni</h1>
  <div class="resto-table" id="table-label">Chargement…</div>
</div>

<!-- MES DEMANDES -->
<div id="mes-demandes-section" class="mes-demandes" style="display:none">
  <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Mes demandes</div>
  <div id="mes-demandes-list"></div>
</div>

<!-- NAV CATÉGORIES -->
<div class="cats-nav" id="cats-nav"></div>

<!-- MENU -->
<div class="menu-content" id="menu-content">
  <div class="empty-state"><div class="icon">🍕</div>Chargement du menu…</div>
</div>

<!-- PANIER FLOTTANT -->
<div class="panier-float" id="panier-float" style="display:none">
  <button class="panier-btn" onclick="openPanierModal()">
    <span>🛒 Voir mon panier</span>
    <span class="panier-count" id="panier-count">0</span>
    <span id="panier-total-float">0,00 €</span>
  </button>
</div>

<!-- MODAL PANIER -->
<div id="modal-panier" class="modal-overlay" onclick="closeModalBackdrop(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2>Mon panier</h2>
      <button class="modal-close" onclick="closePanierModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-panier-body"></div>
    <div class="modal-footer" id="modal-panier-footer"></div>
  </div>
</div>

<!-- MODAL ARTICLE (commentaire) -->
<div id="modal-article" class="modal-overlay" onclick="closeModalBackdrop(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2 id="modal-article-title">Article</h2>
      <button class="modal-close" onclick="closeArticleModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px">Ajoutez un commentaire (optionnel)</p>
      <textarea id="article-comment" placeholder="Ex: sans oignons, bien cuit…" style="height:80px;resize:none"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-envoyer" onclick="confirmerAjoutArticle()">Ajouter au panier</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbx0wSPwI7fA-oOWbmkscPssXGq1eHtJShkESvo91gpycVLPU2an4jVgAhnmGCnMixTMgQ/exec",
  POLL_INTERVAL: 5000,
  FETCH_TIMEOUT: 8000,
};

// ============================================================
// ÉTAT LOCAL
// ============================================================
let STATE = {
  tableNum: null,
  menu: [],
  categories: [],
  panier: [],
  mesDemandesIds: JSON.parse(localStorage.getItem('gio_demandes') || '[]'),
  mesDemandesData: [],
  pendingArticle: null,
  pollingTimer: null,
};

// CATÉGORIES MASQUÉES CÔTÉ CLIENT
const CATS_MASQUEES = ['Suppléments', 'Menu Bambino'];

// ============================================================
// UTILITAIRES
// ============================================================
function formatPrice(p) {
  return parseFloat(p).toFixed(2).replace('.', ',') + ' €';
}

function generateId(prefix) {
  return (prefix||'id') + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
}

function showToast(msg, type = 'default') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2500);
  setTimeout(() => t.remove(), 2900);
}

// ============================================================
// API
// ============================================================
async function apiFetch(url, options = {}) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), CONFIG.FETCH_TIMEOUT);
  try {
    const res = await fetch(url, { ...options, signal: ctrl.signal });
    clearTimeout(tid);
    return JSON.parse(await res.text());
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

async function apiGet(action, params = {}) {
  const url = new URL(CONFIG.APPS_SCRIPT_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  return apiFetch(url.toString());
}

async function apiPost(action, data) {
  return apiFetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action, data }),
  });
}

// ============================================================
// CHARGER LE MENU
// ============================================================
async function chargerMenu() {
  if (!CONFIG.APPS_SCRIPT_URL) {
    document.getElementById('menu-content').innerHTML =
      '<div class="empty-state"><div class="icon">⚙️</div>Application en cours de configuration</div>';
    return;
  }
  try {
    const res = await apiGet('getMenu');
    if (res.menu) {
      STATE.menu = res.menu;
      STATE.categories = [...new Set(res.menu.map(m => m.categorie))]
        .filter(c => !CATS_MASQUEES.includes(c));
      renderMenu();
    }
  } catch(e) {
    document.getElementById('menu-content').innerHTML =
      '<div class="empty-state"><div class="icon">📶</div>Impossible de charger le menu.<br>Vérifiez votre connexion.</div>';
  }
}

// ============================================================
// RENDU DU MENU
// ============================================================
function renderMenu() {
  // Nav catégories
  const navEl = document.getElementById('cats-nav');
  navEl.innerHTML = STATE.categories.map((c, i) =>
    `<button class="cat-nav-btn ${i===0?'active':''}" onclick="scrollToSection('${c}',this)">${c}</button>`
  ).join('');

  // Contenu
  const contentEl = document.getElementById('menu-content');
  let html = '';

  STATE.categories.forEach(cat => {
    const items = STATE.menu.filter(m => m.categorie === cat && !CATS_MASQUEES.includes(m.categorie));
    if (items.length === 0) return;

    html += `<div class="cat-section" id="cat-${CSS.escape(cat)}">
      <div class="cat-title">${cat}</div>
      ${items.map(m => renderArticleCard(m)).join('')}
    </div>`;
  });

  contentEl.innerHTML = html || '<div class="empty-state"><div class="icon">🍕</div>Menu non disponible</div>';
}

function renderArticleCard(m) {
  const indispo = !m.actif;
  return `<div class="article-card">
    <div class="article-info">
      <div class="article-nom ${indispo ? 'strikethrough' : ''}" style="${indispo ? 'opacity:.5' : ''}">${m.nom}</div>
      ${indispo ? '<div class="article-indispo">Non disponible</div>' : ''}
    </div>
    <span class="article-prix">${formatPrice(m.prix)}</span>
    <button class="add-btn" onclick="ajouterArticle('${m.id}')" ${indispo ? 'disabled' : ''} aria-label="Ajouter">+</button>
  </div>`;
}

function scrollToSection(cat, btn) {
  const el = document.getElementById('cat-' + CSS.escape(cat));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.querySelectorAll('.cat-nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

// Intersection observer pour nav catégories
function setupCatObserver() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const cat = entry.target.querySelector('.cat-title')?.textContent;
        if (cat) {
          document.querySelectorAll('.cat-nav-btn').forEach(b => {
            b.classList.toggle('active', b.textContent === cat);
          });
        }
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('.cat-section').forEach(s => obs.observe(s));
}

// ============================================================
// PANIER
// ============================================================
function ajouterArticle(menuId) {
  const m = STATE.menu.find(x => x.id === menuId);
  if (!m || !m.actif) return;
  STATE.pendingArticle = m;
  // Ouvrir modal commentaire
  document.getElementById('modal-article-title').textContent = m.nom;
  document.getElementById('article-comment').value = '';
  document.getElementById('modal-article').classList.add('active');
}

function confirmerAjoutArticle() {
  const m = STATE.pendingArticle;
  if (!m) return;
  const commentaire = document.getElementById('article-comment').value.trim();
  // Chercher si déjà dans panier (même article, même commentaire)
  const existing = STATE.panier.find(l => l.menuId === m.id && l.commentaire === commentaire);
  if (existing) {
    existing.qte++;
  } else {
    STATE.panier.push({
      id: generateId('ligne'),
      menuId: m.id,
      nom: m.nom,
      categorie: m.categorie,
      station: m.station,
      prix: m.prix,
      qte: 1,
      statut: 'en_attente',
      commentaire: commentaire,
      addedAt: Date.now(),
    });
  }
  STATE.pendingArticle = null;
  closeArticleModal();
  updatePanierFloat();
  showToast(m.nom + ' ajouté', 'success');
}

function closeArticleModal() {
  document.getElementById('modal-article').classList.remove('active');
  STATE.pendingArticle = null;
}

function updatePanierFloat() {
  const total = STATE.panier.reduce((s,l) => s + l.prix * l.qte, 0);
  const count = STATE.panier.reduce((s,l) => s + l.qte, 0);
  const floatEl = document.getElementById('panier-float');
  floatEl.style.display = count > 0 ? '' : 'none';
  document.getElementById('panier-count').textContent = count;
  document.getElementById('panier-total-float').textContent = formatPrice(total);
}

// ============================================================
// MODAL PANIER
// ============================================================
function openPanierModal() {
  renderPanierModal();
  document.getElementById('modal-panier').classList.add('active');
}

function closePanierModal() {
  document.getElementById('modal-panier').classList.remove('active');
}

function closeModalBackdrop(e) {
  if (e.target.id === 'modal-panier') closePanierModal();
  if (e.target.id === 'modal-article') closeArticleModal();
}

function renderPanierModal() {
  const body = document.getElementById('modal-panier-body');
  const footer = document.getElementById('modal-panier-footer');

  if (STATE.panier.length === 0) {
    body.innerHTML = '<div class="empty-state"><div class="icon">🛒</div>Votre panier est vide</div>';
    footer.innerHTML = '';
    return;
  }

  const total = STATE.panier.reduce((s,l) => s + l.prix * l.qte, 0);

  let html = STATE.panier.map(l => `
    <div class="panier-ligne" id="pl-${l.id}">
      <div class="pl-top">
        <span class="pl-nom">${l.nom}</span>
        <span class="pl-prix">${formatPrice(l.prix * l.qte)}</span>
        <div class="qte-ctrl">
          <button class="qte-btn" onclick="panierQte('${l.id}',-1)">−</button>
          <span class="qte-val">${l.qte}</span>
          <button class="qte-btn" onclick="panierQte('${l.id}',1)">+</button>
        </div>
      </div>
      ${l.commentaire ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px">💬 ${l.commentaire}</div>` : ''}
    </div>`).join('');

  html += `<div class="total-row">
    <span>Total</span>
    <span class="total-price">${formatPrice(total)}</span>
  </div>`;

  body.innerHTML = html;
  footer.innerHTML = `<button class="btn-envoyer" onclick="envoyerCommande()">Envoyer ma commande — ${formatPrice(total)}</button>`;
}

function panierQte(ligneId, delta) {
  const l = STATE.panier.find(x => x.id === ligneId);
  if (!l) return;
  l.qte = Math.max(0, l.qte + delta);
  if (l.qte === 0) STATE.panier = STATE.panier.filter(x => x.id !== ligneId);
  renderPanierModal();
  updatePanierFloat();
  if (STATE.panier.length === 0) closePanierModal();
}

// ============================================================
// ENVOYER COMMANDE
// ============================================================
async function envoyerCommande() {
  if (STATE.panier.length === 0) return;
  const btn = document.querySelector('.btn-envoyer');
  if (btn) btn.disabled = true;

  const total = STATE.panier.reduce((s,l) => s + l.prix * l.qte, 0);
  const data = {
    table: STATE.tableNum,
    lignes: STATE.panier,
    total: total.toFixed(2),
  };

  try {
    const res = await apiPost('soumettreCommandeClient', data);
    if (res && res.success) {
      // Mémoriser l'ID dans localStorage
      const ids = JSON.parse(localStorage.getItem('gio_demandes') || '[]');
      ids.push(res.id);
      // Garder seulement les 10 dernières
      if (ids.length > 10) ids.splice(0, ids.length - 10);
      localStorage.setItem('gio_demandes', JSON.stringify(ids));
      STATE.mesDemandesIds = ids;

      STATE.panier = [];
      updatePanierFloat();
      closePanierModal();

      // Afficher confirmation
      showConfirmation(res.id);
      startPollingDemandes();
    } else {
      showToast('Erreur lors de l\'envoi', 'error');
      if (btn) btn.disabled = false;
    }
  } catch(e) {
    showToast('Connexion perdue — réessayez', 'error');
    if (btn) btn.disabled = false;
  }
}

function showConfirmation(cmdId) {
  // Montrer section mes demandes
  const section = document.getElementById('mes-demandes-section');
  section.style.display = '';
  section.scrollIntoView({ behavior: 'smooth' });
  updateMesDemandes();
}

// ============================================================
// POLLING STATUT DEMANDES
// ============================================================
function startPollingDemandes() {
  if (STATE.pollingTimer) clearInterval(STATE.pollingTimer);
  if (!CONFIG.APPS_SCRIPT_URL) return;
  STATE.pollingTimer = setInterval(pollDemandes, CONFIG.POLL_INTERVAL);
  pollDemandes();
}

async function pollDemandes() {
  if (STATE.mesDemandesIds.length === 0) return;
  // Rafraîchir chaque demande connue
  const updates = [];
  for (const id of STATE.mesDemandesIds) {
    try {
      const res = await apiGet('getCommandeClient', { id });
      if (res.commande) updates.push(res.commande);
    } catch(e) {}
  }
  STATE.mesDemandesData = updates;
  updateMesDemandes();

  // Aussi rafraîchir la disponibilité des articles
  try {
    const menuRes = await apiGet('getMenu');
    if (menuRes.menu) {
      const changed = menuRes.menu.some(m => {
        const old = STATE.menu.find(x => x.id === m.id);
        return old && old.actif !== m.actif;
      });
      STATE.menu = menuRes.menu;
      if (changed) renderMenu();
    }
  } catch(e) {}
}

function updateMesDemandes() {
  const list = document.getElementById('mes-demandes-list');
  if (!list) return;
  if (STATE.mesDemandesData.length === 0 && STATE.mesDemandesIds.length === 0) return;

  const section = document.getElementById('mes-demandes-section');
  section.style.display = '';

  if (STATE.mesDemandesData.length === 0) {
    list.innerHTML = '<div style="font-size:13px;color:var(--text-muted)">Chargement…</div>';
    return;
  }

  let html = '';
  STATE.mesDemandesData.forEach(cmd => {
    let statusLabel, statusColor, icon;
    switch(cmd.statut) {
      case 'en_attente_validation':
        icon = '⏳'; statusLabel = 'En attente de confirmation du serveur'; statusColor = 'var(--or)';
        break;
      case 'brouillon':
      case 'ouverte':
        icon = '✅'; statusLabel = 'Commande acceptée ! Votre serveur s\'en occupe.'; statusColor = 'var(--green)';
        break;
      case 'refusée':
        icon = '❌'; statusLabel = 'Votre demande n\'a pas pu être prise en compte. Un serveur passe vous voir.'; statusColor = 'var(--terre)';
        break;
      case 'payée':
        icon = '✓'; statusLabel = 'Commande réglée'; statusColor = 'var(--text-muted)';
        break;
      default:
        icon = '•'; statusLabel = cmd.statut; statusColor = 'var(--text-muted)';
    }

    let lignes = [];
    try { lignes = typeof cmd.lignes === 'string' ? JSON.parse(cmd.lignes) : (cmd.lignes || []); } catch(e) {}
    const items = lignes.map(l => (l.qte||1) + '× ' + l.nom).join(', ');

    html += `<div class="demande-card ${cmd.statut === 'en_attente_validation' ? 'en-attente' : cmd.statut === 'refusée' ? 'refusee' : 'acceptee'}">
      <div class="demande-status" style="color:${statusColor}">${icon} ${statusLabel}</div>
      ${items ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px">${items}</div>` : ''}
    </div>`;
  });

  list.innerHTML = html;
}

// ============================================================
// INIT
// ============================================================
async function init() {
  // Lire le numéro de table depuis l'URL
  const params = new URLSearchParams(window.location.search);
  STATE.tableNum = params.get('table') || '?';

  const label = document.getElementById('table-label');
  if (label) {
    label.textContent = STATE.tableNum !== '?'
      ? 'Table ' + STATE.tableNum
      : 'Menu — Scannez un QR code de table';
  }

  await chargerMenu();

  // Afficher les demandes précédentes si existantes
  if (STATE.mesDemandesIds.length > 0) {
    document.getElementById('mes-demandes-section').style.display = '';
    startPollingDemandes();
  }

  // Observer les sections pour nav active
  setTimeout(setupCatObserver, 300);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
